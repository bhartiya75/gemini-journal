<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Gemini Journal</title>
<style>
  :root { --ink:#1f2937; --soft:#6b7280; --paper:#faf9f7; --card:#fff;
          --accent:#4f46e5; --accent-soft:#eef2ff; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Helvetica Neue',Arial,sans-serif; background:var(--paper);
         color:var(--ink); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between;
           padding:14px 22px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:1.05rem; margin:0; }
  header .who { font-size:.85rem; color:var(--soft); }
  button { border:0; border-radius:8px; padding:9px 16px; font-weight:600;
           cursor:pointer; background:var(--accent); color:#fff; font-size:.9rem; }
  button.ghost { background:var(--accent-soft); color:var(--accent); }
  main { flex:1; display:flex; min-height:0; }
  #left { flex:1.4; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #chat { flex:1; overflow-y:auto; padding:20px; }
  .msg { max-width:82%; margin-bottom:12px; padding:10px 14px; border-radius:10px;
         line-height:1.45; font-size:.95rem; white-space:pre-wrap; }
  .user { background:var(--accent-soft); margin-left:auto; }
  .model { background:var(--card); border:1px solid var(--line); }
  #composer { display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--line);
              background:var(--card); }
  #composer input { flex:1; padding:11px 14px; border:1px solid var(--line);
                    border-radius:8px; font-size:.95rem; }
  #right { flex:1; overflow-y:auto; padding:20px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px;
           padding:16px; margin-bottom:16px; }
  .panel h2 { margin:0 0 10px; font-size:.95rem; }
  .entry { border-top:1px solid var(--line); padding:10px 0; font-size:.88rem; }
  .entry .meta { color:var(--soft); font-size:.78rem; margin-bottom:4px; }
  .tag { display:inline-block; background:var(--accent-soft); color:var(--accent);
         border-radius:20px; padding:1px 9px; font-size:.75rem; margin-right:4px; }
  #gate { position:fixed; inset:0; background:var(--paper); display:flex;
          align-items:center; justify-content:center; }
  #gate form { background:var(--card); border:1px solid var(--line); border-radius:14px;
               padding:30px; width:320px; display:flex; flex-direction:column; gap:10px; }
  #gate input { padding:11px 12px; border:1px solid var(--line); border-radius:8px; }
  #gate .err { color:#b91c1c; font-size:.8rem; min-height:1em; }
  .muted { color:var(--soft); font-size:.85rem; }
</style>
</head>
<body>

<div id="gate">
  <form id="authForm">
    <h1 style="font-size:1.15rem;margin:0">📔 Personal Gemini Journal</h1>
    <p class="muted" style="margin:0 0 6px">Sign in to your private journal.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="password" type="password" placeholder="Password (6+ chars)" autocomplete="current-password" required>
    <div class="err" id="authErr"></div>
    <button type="submit">Sign in</button>
    <button type="button" class="ghost" id="signupBtn">Create account</button>
  </form>
</div>

<header hidden id="topbar">
  <h1>📔 Personal Gemini Journal</h1>
  <div style="display:flex;gap:12px;align-items:center">
    <span class="who" id="who"></span>
    <button class="ghost" id="signout">Sign out</button>
  </div>
</header>

<main hidden id="app">
  <section id="left">
    <div id="chat"></div>
    <div id="composer">
      <input id="msg" placeholder="What's on your mind today?" maxlength="4000">
      <button id="send">Send</button>
      <button class="ghost" id="save">Save entry</button>
    </div>
  </section>
  <section id="right">
    <div class="panel">
      <h2>🪞 Reflections <span class="muted">— your patterns, noticed</span></h2>
      <div id="reflections" class="muted">Loading…</div>
      <button class="ghost" id="refreshRef" style="margin-top:10px">Refresh</button>
    </div>
    <div class="panel">
      <h2>🗂 Saved entries</h2>
      <div id="entries" class="muted">Loading…</div>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBu82XOpO2AOmhIdAkRWfd7QCqXKzVHxDs",   // public client key
  authDomain: "genai-academy-c3-357d.firebaseapp.com",
  projectId: "genai-academy-c3-357d",
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);

const $ = (id) => document.getElementById(id);
let user = null;

async function api(path, opts = {}) {
  const token = await user.getIdToken();
  const res = await fetch(path, {
    ...opts,
    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json",
               ...(opts.headers || {}) },
  });
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

async function sendMessage() {
  const text = $("msg").value.trim();
  if (!text) return;
  $("msg").value = "";
  addMsg("user", text);
  const pending = addMsg("model", "…");
  try {
    const { reply } = await api("/api/chat", { method: "POST", body: JSON.stringify({ message: text }) });
    pending.textContent = reply;
  } catch (e) { pending.textContent = `⚠️ ${e.message}`; }
}

async function saveEntry() {
  try {
    const { entry } = await api("/api/save", { method: "POST" });
    addMsg("model", `📔 Saved: ${entry.summary}`);
    $("chat").querySelectorAll(".msg:not(:last-child)").forEach(m => m.remove());
    loadEntries(); loadReflections();
  } catch (e) { addMsg("model", `⚠️ ${e.message}`); }
}

async function loadEntries() {
  try {
    const { entries } = await api("/api/entries");
    $("entries").innerHTML = entries.length ? "" : "No entries yet — chat, then Save entry.";
    for (const e of entries) {
      const d = document.createElement("div");
      d.className = "entry";
      d.innerHTML = `<div class="meta">${(e.ts || "").slice(0, 10)} · mood: ${e.mood}</div>
        <div>${e.summary}</div>
        <div style="margin-top:4px">${(e.themes || []).map(t => `<span class="tag">${t}</span>`).join("")}</div>`;
      $("entries").appendChild(d);
    }
  } catch { $("entries").textContent = "Could not load entries."; }
}

async function loadReflections() {
  try {
    const r = await api("/api/reflections");
    if (!r.ready) { $("reflections").textContent = `Save ${r.needed} more entr${r.needed === 1 ? "y" : "ies"} to unlock Reflections.`; return; }
    $("reflections").innerHTML =
      `<div style="margin-bottom:8px">${(r.themes || []).map(t =>
          `<div><span class="tag">${t.theme}</span> <span class="muted">${t.reason}</span></div>`).join("")}</div>
       <div style="margin-bottom:8px"><b>Mood trend:</b> ${r.mood_trend}</div>
       <div style="background:var(--accent-soft);border-radius:8px;padding:10px">💡 ${r.insight}</div>
       <div class="muted" style="margin-top:6px">${r.entries_analyzed} entries analyzed</div>`;
  } catch { $("reflections").textContent = "Could not load reflections."; }
}

$("authForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try { await signInWithEmailAndPassword(auth, $("email").value, $("password").value); }
  catch (e) { $("authErr").textContent = e.code || e.message; }
});
$("signupBtn").addEventListener("click", async () => {
  try { await createUserWithEmailAndPassword(auth, $("email").value, $("password").value); }
  catch (e) { $("authErr").textContent = e.code || e.message; }
});
$("signout").addEventListener("click", () => signOut(auth));
$("send").addEventListener("click", sendMessage);
$("msg").addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
$("save").addEventListener("click", saveEntry);
$("refreshRef").addEventListener("click", loadReflections);

onAuthStateChanged(auth, (u) => {
  user = u;
  $("gate").hidden = !!u;
  $("app").hidden = !u;
  $("topbar").hidden = !u;
  if (u) { $("who").textContent = u.email; loadEntries(); loadReflections(); }
});
</script>
</body>
</html>
